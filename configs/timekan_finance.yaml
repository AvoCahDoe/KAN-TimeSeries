seed: 2021
device: cuda
data:
  dataset: Finance
  seq_len: 60
  pred_len: 20
  finance: true
model:
  name: TimeKAN
  d_model: 48
  k_bands: 3
  decomp_mode: adaptive
  fusion_mode: attention
  n_kan_layers: 2
  basis: chebyshev
  use_revin: true
train:
  batch_size: 32
  epochs: 15
  lr: 0.001
  patience: 4
