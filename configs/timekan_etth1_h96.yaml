# TimeKAN on ETTh1, horizon 96
seed: 2021
device: cuda

data:
  dataset: ETTh1
  seq_len: 96
  pred_len: 96

model:
  name: TimeKAN
  d_model: 64
  k_bands: 3
  decomp_mode: adaptive
  fusion_mode: attention
  n_kan_layers: 2
  basis: chebyshev
  use_revin: true
  dropout: 0.1

train:
  batch_size: 32
  epochs: 10
  lr: 0.001
  weight_decay: 0.0001
  patience: 3
  grad_clip: 1.0
