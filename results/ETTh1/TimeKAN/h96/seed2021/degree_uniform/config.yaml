data:
  dataset: ETTh1
  pred_len: 96
  seq_len: 96
device: cuda
model:
  basis: chebyshev
  d_model: 32
  decomp_mode: fixed
  fusion_mode: attention
  k_bands: 3
  name: TimeKAN
  uniform_degree: 4
  use_revin: true
seed: 2021
